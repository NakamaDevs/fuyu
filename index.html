<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Fuyu: una aventura sobre encontrar al personaje y regresar a uno mismo."><title>Fuyu</title><link rel="stylesheet" href="/src/presentation/style.css"></head><body>
<header><div class="brand"><span class="sigil">◈</span><div><strong>FUYU</strong><small data-i18n="subtitle">EL PAPEL INTERIOR</small></div></div><div class="header-right"><span data-i18n="tagline"></span><div class="languages" aria-label="Idioma / Language"><button id="es" lang="es">ES</button><button id="en" lang="en">EN</button></div></div></header>
<main><section class="intro"><div><div class="eyebrow" data-i18n="eyebrow"></div><h1 data-i18n="heading"></h1><p data-i18n="intro"></p></div><button class="quiet" id="restart" data-i18n="restart"></button></section>
<div class="layout"><section><div class="game-shell" id="gameShell"><div class="game-top"><span class="location" id="location"></span><div class="game-tools"><span class="view-label" id="viewLabel"></span><button id="fullscreenButton" class="quiet" type="button"></button></div></div><div id="viewport" tabindex="0" aria-label="Fuyu"><div class="hud"><div class="vital"><div class="health" id="health"></div><div class="energy-track" aria-label="Energía"><div id="energy"></div></div><span id="echoCount"></span></div><div class="vital hud-stage"><span data-i18n="form"></span><b id="formLabel"></b></div></div><div class="prompt" id="prompt" hidden></div><div class="toast" id="toast" hidden></div>
<div class="overlay" id="start"><div class="start-copy"><div class="eyebrow" data-i18n="startEyebrow"></div><h2><span data-i18n="startTitle"></span><br><i data-i18n="startTitle2"></i></h2><p data-i18n="startText"></p><button class="primary" id="begin" data-i18n="begin"></button></div></div>
<div class="overlay" id="pause" hidden><div class="start-copy"><div class="eyebrow" data-i18n="intermission"></div><h2 data-i18n="pauseTitle"></h2><button class="primary" id="resume" data-i18n="resume"></button></div></div>
<div class="dialogue" id="dialogue" hidden><div class="portrait" id="portrait"></div><div class="dialogue-copy"><div class="speaker" id="speaker"></div><h3 id="dialogueTitle"></h3><p id="dialogueText"></p><button class="primary" id="next" data-i18n="continue"></button></div></div>
<div class="map-pop" id="map" hidden><div class="map-title"><h3 data-i18n="mapTitle"></h3><button class="quiet" id="closeMap" data-i18n="close"></button></div><svg id="mapSvg" viewBox="0 0 830 360" role="img" aria-label="Mapa"></svg><div class="map-legend"><span data-i18n="mapLegend"></span></div></div><div id="error" role="alert"></div></div>
<div class="mobile" id="touchControls"><div id="joystick" role="group" aria-label="Movimiento / Movement"><span class="pad-arrows" aria-hidden="true">✥</span><span class="stick"></span></div><div class="touch-actions"><button data-key="KeyK" class="touch-dash">Dash</button><button data-key="KeyE" class="touch-interact" data-i18n="interact"></button><button data-key="KeyQ" class="touch-jump" data-i18n="jump"></button><button data-key="KeyJ" class="touch-attack" data-i18n="attack"></button><button data-key="Space" class="touch-run" data-i18n="run"></button></div></div>
<div class="game-bottom"><div class="controls"><span><kbd>WASD</kbd><span data-i18n="move"></span></span><span><kbd>Espacio</kbd><span data-i18n="run"></span></span><span><kbd>Q</kbd><span data-i18n="jump"></span></span><span><kbd>J</kbd><span data-i18n="attack"></span></span><span id="dashHint" hidden><kbd>K</kbd>Dash</span><span><kbd>E</kbd><span data-i18n="interact"></span></span></div><div><button id="mapButton" class="text-button"><kbd>M</kbd><span data-i18n="map"></span></button><button id="pauseButton" class="text-button"><span data-i18n="pauseLabel"></span></button></div></div></div>

<div class="under"><em data-i18n="quote"></em><span data-i18n="worldNote"></span></div></section>
<aside><div class="panel"><div class="eyebrow" data-i18n="identity"></div><h2 id="identityTitle"></h2><p id="identityText"></p><div class="ability" id="ability"></div></div><div class="panel"><div class="eyebrow" data-i18n="memories"></div><h2 id="memoryTitle"></h2><p id="memoryText"></p><button class="quiet" id="asideMap" data-i18n="mapTitle"></button></div><p class="note" data-i18n="note"></p></aside></div>
<details id="lab"><summary data-i18n="labTitle"></summary><div class="lab-panel"><p data-i18n="labIntro"></p><div id="scenarios"></div><div class="lab-actions"><button class="quiet" id="record" data-i18n="record"></button><button class="quiet" id="export" data-i18n="export"></button><button class="quiet" id="resetLab" data-i18n="exitLab"></button></div><output id="metrics"></output><div id="recordings"></div><div id="labStatus" role="status"></div></div></details>
<footer><span>FUYU · 0.2</span><span data-i18n="footer"></span></footer></main><script src="/vendor/pixi.min.js"></script><script type="module" src="/src/application/main.js"></script></body></html>
